name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bridge regression suite
        run: python -m unittest discover -s tools/claude-codex-bridge/tests -v
      - name: Project installation suite
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
